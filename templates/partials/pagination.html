{% load ui_tags %}
{% if is_paginated %}
<nav class="mt-8 flex items-center justify-between text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="btn btn-secondary" href="?{% url_replace page=page_obj.previous_page_number %}">Previous</a>
  {% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-secondary" href="?{% url_replace page=page_obj.next_page_number %}">Next</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
