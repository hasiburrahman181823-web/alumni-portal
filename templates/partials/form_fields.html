{% if form.non_field_errors %}
  <div class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 dark:border-red-800 dark:bg-red-950 dark:text-red-200">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">
      {{ field.label }}{% if field.field.required %}<span class="text-red-600"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div class="mt-1 text-xs muted">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="mt-1 text-xs font-medium text-red-600 dark:text-red-400">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
