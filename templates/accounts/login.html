{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-6 font-serif text-3xl font-bold">Log in</h1>
  <form method="post" class="card space-y-5 p-6" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'partials/form_fields.html' %}
    <button class="btn btn-primary w-full">Log in</button>
  </form>
  <p class="mt-4 text-sm muted">New here? <a href="{% url 'accounts:register' %}" class="font-medium text-teal-700 underline dark:text-teal-300">Create an account</a>.</p>
</div>
{% endblock %}
