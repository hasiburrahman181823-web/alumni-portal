{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="mb-6 font-serif text-3xl font-bold">Edit your profile</h1>
  <form method="post" enctype="multipart/form-data" class="card space-y-5 p-6" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' with form=user_form %}
    <hr class="border-slate-200 dark:border-slate-700">
    {% include 'partials/form_fields.html' with form=profile_form %}
    <div class="flex gap-3 pt-2">
      <button class="btn btn-primary">Save profile</button>
      <a href="{% url 'accounts:profile' user.username %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
