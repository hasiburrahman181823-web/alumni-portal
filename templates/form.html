{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="mb-6 font-serif text-3xl font-bold">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="card space-y-5 p-6" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save" }}</button>
      <a href="{{ cancel_url|default:'/' }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
