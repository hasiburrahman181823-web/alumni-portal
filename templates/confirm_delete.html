{% extends 'base.html' %}
{% block title %}Confirm deletion{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <div class="card p-6">
    <h1 class="font-serif text-2xl font-bold">Delete “{{ object }}”?</h1>
    <p class="mt-2 text-sm muted">This permanently removes it and can't be undone.</p>
    <form method="post" class="mt-6 flex gap-3">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Keep it</a>
    </form>
  </div>
</div>
{% endblock %}
